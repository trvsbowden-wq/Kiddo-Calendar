function parseCSV(text) {
  const fl = text.split("\n")[0]||""; const isT = fl.includes("\t");
  const lines = text.split("\n"); if (lines.length<2) return {};
  const evts = {};
  for (let i=1;i<lines.length;i++) {
    const row = isT?lines[i].split("\t"):pR(lines[i]);
    if (!row||row.length<6||!row[0]) continue;
    const [date,title,time,kid,type,desc,action,loc,teacher,dress] = row.map(f=>(f||"").replace(/^"|"$/g,"").trim());
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) continue;
    if (!evts[date]) evts[date]=[];
    evts[date].push({title:title||"",time:time||"",kid:kid?.toLowerCase()||"both",type:type?.toLowerCase()||"event",desc:desc||"",action:action||"",loc:loc||"",t:teacher||"",dress:dress?.toUpperCase()==="TRUE",fromSheet:true});
  }
  return evts;
}
function pR(r){if(!r?.trim())return null;const res=[];let c="",q=false;for(let i=0;i<r.length;i++){const ch=r[i];if(ch==='"')q=!q;else if(ch===','&&!q){res.push(c);c="";}else c+=ch;}res.push(c);return res;}
function gP(k,sp){const r=[];if(sp[k])sp[k].forEach(e=>{if(e.prep)r.push({kid:e.kid,prep:e.prep,title:e.title});else if(e.dress&&e.action)r.push({kid:e.kid,prep:e.action,title:e.title});});return r;}

function Cal() {

  const [ss,setSs] = useState(false);
  const [shE,setShE] = useState({});
  const [shS,setShS] = useState("loading");
  const [shD,setShD] = useState("");

  useEffect(()=>{(async()=>{
    try {
      setShS("loading");setShD("Checking cache...");
      // Check localStorage cache (6-hour TTL)
      try{
        const raw=localStorage.getItem("cal-cache");
        if(raw){const c=JSON.parse(raw);const age=Date.now()-(c.ts||0);if(age<6*3600000&&c.e){const n=Object.values(c.e).flat().length;if(n>0){setShE(c.e);setShD(`${n} events · cached ${Math.round(age/3600000*10)/10}h ago`);setShS("cached");return;}}}
      }catch(e){}
      setShD("Fetching events...");
      let parsed={},method="",lastErr="";

      // Primary: Apps Script Web App (JSON)
      if(!method&&WEBAPP_URL){try{
        const r=await fetch(WEBAPP_URL,{redirect:"follow"});
        if(r.ok){const j=await r.json();if(j.events?.length>0){for(const e of j.events){if(!e.date)continue;if(!parsed[e.date])parsed[e.date]=[];parsed[e.date].push({title:e.title||"",time:e.time||"",kid:(e.kid||"both").toLowerCase(),type:(e.type||"event").toLowerCase(),desc:e.description||e.desc||"",action:e.action||"",loc:e.location||e.loc||"",t:e.teacher||e.t||"",dress:String(e.dress).toUpperCase()==="TRUE",fromSheet:true});}method="webapp";}else{lastErr="Webapp: no events in response";}}
        else{lastErr=`Webapp HTTP ${r.status}`;}
      }catch(e){lastErr=`Webapp: ${e.message}`;}}

      // Fallback: Published Google Sheet CSV
      if(!method&&SHEET_CSV_URL){try{
        const r=await fetch(SHEET_CSV_URL);
        if(r.ok){const txt=await r.text();const p=parseCSV(txt);if(Object.keys(p).length>0){parsed=p;method="csv";}else{lastErr="CSV: 0 events parsed";}}
        else{lastErr=`CSV HTTP ${r.status}`;}
      }catch(e){lastErr=`CSV: ${e.message}`;}}

      const cnt=Object.values(parsed).flat().length;
      if(cnt>0){setShE(parsed);try{localStorage.setItem("cal-cache",JSON.stringify({e:parsed,ts:Date.now()}));}catch(e){}setShD(`${cnt} events via ${method}`);setShS("synced");}
      else{setShD(lastErr||"No events found");setShS("parse-error");}
    }catch(err){
      try{const raw=localStorage.getItem("cal-cache");if(raw){const c=JSON.parse(raw);const n=Object.values(c.e||{}).flat().length;if(n>0){setShE(c.e);setShD(`${n} cached · ${err.message}`);setShS("stale-cache");return;}}}catch(e){}
      setShD(err.message);setShS("error");
    }
  })();},[]);

  // Normalize title for fuzzy dedup — strips emojis, lowercases, removes punctuation
  const normT=t=>String(t).replace(/[\u{1F000}-\u{1FFFF}]|[\u{2600}-\u{26FF}]|[\u{2700}-\u{27BF}]/gu,'').toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
  const titleDupe=(a,b)=>{if(!a||!b)return false;if(a===b)return true;if(a.length>3&&b.length>3&&(a.includes(b)||b.includes(a)))return true;const wa=a.split(' ').filter(w=>w.length>2),wb=b.split(' ').filter(w=>w.length>2);if(!wa.length||!wb.length)return false;const[sh,lo]=wa.length<=wb.length?[wa,wb]:[wb,wa];return sh.filter(w=>lo.includes(w)).length/sh.length>=0.8;};
  const merged=useMemo(()=>{const m={...SE};for(const[k,v]of Object.entries(shE)){if(!m[k])m[k]=[];for(const e of v)if(!m[k].some(x=>x.kid===e.kid&&titleDupe(normT(x.title),normT(e.title))))m[k].push(e);}return m;},[shE]);

  function gE(key,dow){
    const ev=[];
    if(HOL[key]){ev.push({title:HOL[key],time:"No School",kid:"both",type:"holiday",desc:`${HOL[key]} — no school`});return ev;}

    if(SDV[key])ev.push({title:`📝 ${SDV[key]}`,time:"No School",kid:"evelyn",type:"holiday",desc:"No school — teacher dev. Kido may be open."});

    const eOff=SDV[key]||merged[key]?.some(e=>e.type==="holiday"&&(e.kid==="evelyn"||e.kid==="both"));
    const wd=dow>=1&&dow<=5;
    if(wd){
      if(!eOff){
        ev.push({title:"Kindergarten",time:"7:30 AM – 2:45 PM",kid:"evelyn",type:"school",desc:"RPE — Ms. Jevnikar",det:"Drop-off 7:10, school 7:30, dismiss 2:45.",loc:"RPE — Room 0009",t:"Ms. Jevnikar"});
        if(dow===1)ev.push({title:"🏃 Run Club",time:"During PE",kid:"evelyn",type:"school",desc:"Mondays — running shoes!",action:"👟 Running shoes!",loc:"RPE — Track",t:"Coach Warner"});
        ev.push({title:"Kido Afterschool",time:"2:45 – 6:00 PM",kid:"evelyn",type:"kido",desc:"Innovators with Ms. Rebecca",loc:"Kido — 10625 Bonaventure Dr",t:"Ms. Rebecca Russell"});
        if(EW[dow]){const e=EW[dow];ev.push({title:e.title,time:"3:00 PM",kid:"evelyn",type:"kido",desc:e.desc,det:e.det,loc:e.loc,t:e.t});}

      if(VW[dow]){const e=VW[dow];ev.push({title:e.title,time:"During day",kid:"violet",type:"kido",desc:e.desc,det:e.det,loc:e.loc,t:e.t});}
    }
    if(merged[key])ev.push(...merged[key]);
    return ev;
  }

  const dim=new Date(yr,mo+1,0).getDate(),fd=new Date(yr,mo,1).getDay();
  const tK=dk(today.getFullYear(),today.getMonth()+1,today.getDate());
  const days=useMemo(()=>{const d=[];for(let i=0;i<fd;i++)d.push(null);for(let i=1;i<=dim;i++)d.push(i);return d;},[mo,yr,dim,fd]);
  const pM=()=>{mo===0?(setMo(11),setYr(yr-1)):setMo(mo-1);setSel(null);setExp(null);};
  const nM=()=>{mo===11?(setMo(0),setYr(yr+1)):setMo(mo+1);setSel(null);setExp(null);};
  const sK=sel?dk(yr,mo+1,sel):null,sD=sel?new Date(yr,mo,sel).getDay():null;
  const sEv=sel?gE(sK,sD).filter(e=>flt==="all"||e.kid===flt||e.kid==="both"):[];
  const fD=()=>sel?new Date(yr,mo,sel).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"}):"";
  const tEv=useMemo(()=>gE(tK,today.getDay()).filter(e=>flt==="all"||e.kid===flt||e.kid==="both"),[flt,tK,merged]);
